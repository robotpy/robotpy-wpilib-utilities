[build-system]
requires = ["hatchling>=1.26.2", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "robotpy-wpilib-utilities"
dynamic = ["version"]
description = "Useful utility functions/objects for RobotPy"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "toposort",
  "wpilib>=2027.0.0a4,<2027.0.0a6.post4",
]

[[project.authors]]
name = "RobotPy Development Team"
email = "robotpy@googlegroups.com"

[project.urls]
"Source code" = "https://github.com/robotpy/robotpy-wpilib-utilities"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".readthedocs.yml",
    "docs",
    "devtools",
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["magicbot", "robotpy_ext"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist.hooks.vcs]
version-file = "robotpy_ext/version.py"
